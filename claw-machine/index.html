<style>
/* One piece of classroom furniture seen front-on: a birch-ply unit whose
   openings hold the spinner (left), the claw machine (centre) and the
   children's cubbies (right). Stacks into one column on portrait screens. */
:root {
  color-scheme: light;
  --ink: #34264A;
  --ink-soft: #5B4D6E;
  --wall: #E3EFE7;
  --birch: #EFD09C;
  --birch-hi: #F7E2BB;
  --birch-lo: #D6AE72;
  --ply-dark: #B98A51;
  --ply-light: #F5DDB3;
  --sun: #FFC83D;
  --sky: #74C4F2;
  --pink: #FF94B8;
  --leaf: #86CF6E;
  --lilac: #BBA3F5;
  --tomato: #FF8A5C;
  --berry: #EF4F7A;
  --berry-deep: #B8285A;
  --deck: #2E2240;
  --led-ground: #1C1328;
  --led: #FFD76A;
  --led-soft: #F7C6DA;
  --paper: #FFFFFF;
  --font-ui: "Jua Local", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-sign: "Bagel Local", "Jua Local", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --gutter: clamp(6px, 1vmin, 14px);
  --ring: clamp(6px, .8vmin, 10px);
  --depth-1: 0 2px 3px rgba(52, 38, 74, .16), 0 8px 18px rgba(52, 38, 74, .14);
  --depth-2: 0 3px 6px rgba(52, 38, 74, .2), 0 18px 34px rgba(52, 38, 74, .2);
  --ply: inset 0 0 0 calc(var(--ring) * .25) var(--ply-dark), inset 0 0 0 calc(var(--ring) * .5) var(--ply-light), inset 0 0 0 calc(var(--ring) * .75) var(--ply-dark), inset 0 0 0 var(--ring) var(--birch-hi);
  --recess: inset 0 calc(var(--ring) + 14px) 18px -14px rgba(52, 38, 74, .34), inset calc(var(--ring) + 12px) 0 16px -14px rgba(52, 38, 74, .2);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding: var(--gutter);
  background: var(--wall);
  color: var(--ink);
  font-family: var(--font-ui);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  caret-color: var(--berry-deep);
}
::selection { background: var(--sun); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

/* ---------- the furniture ---------- */
.unit {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  padding: var(--ring);
  border-radius: 24px;
  background: linear-gradient(180deg, var(--birch-hi) 0%, var(--birch) 60%, var(--birch-lo) 140%);
  box-shadow: var(--ply), var(--depth-2);
}
.rail {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-areas: "plaque sign knobs";
  align-items: center;
  gap: 2vmin;
  padding: clamp(10px, 1.5vmin, 20px) clamp(14px, 2.4vmin, 30px);
  border-radius: 16px;
  background: linear-gradient(180deg, #FAE9CA, var(--birch) 95%);
  box-shadow: var(--ply);
}
.plaque {
  grid-area: plaque;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: .45em;
  max-width: 100%;
  padding: .32em .8em .32em .55em;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 12px;
  font-size: clamp(1.05rem, 2.8vmin, 2rem);
  line-height: 1.1;
  box-shadow: var(--depth-1);
  transform: rotate(-2deg);
}
.plaque-hole { flex: none; width: .5em; height: .5em; border: 2px solid var(--ink); border-radius: 50%; background: var(--birch-lo); }
.plaque span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sign {
  grid-area: sign;
  margin: 0;
  display: flex;
  align-items: center;
  gap: clamp(4px, .7vmin, 10px);
  font-family: var(--font-sign);
  font-weight: 400;
  font-size: clamp(1.6rem, 5.8vmin, 4.3rem);
  line-height: 1;
}
.cut {
  display: grid;
  place-items: center;
  width: 1.26em;
  height: 1.26em;
  padding-bottom: .06em;
  background: var(--p);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: .2em;
  box-shadow: inset 0 0 0 .07em rgba(255, 255, 255, .85), var(--depth-1);
  transform: rotate(var(--t));
}
.cut.space { margin-left: .3em; }
.knobs { grid-area: knobs; justify-self: end; display: flex; gap: clamp(8px, 1.2vmin, 14px); }
.knob {
  width: clamp(44px, 5.4vmin, 60px);
  height: clamp(44px, 5.4vmin, 60px);
  padding: 0;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #FDF1DA, var(--birch) 62%, var(--birch-lo));
  box-shadow: var(--depth-1);
  transition: transform 120ms var(--ease-out);
}
.knob svg { width: 46%; height: 46%; }
.knob:active { transform: translateY(2px) scale(.97); }

.bays {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
}
.hole {
  position: relative;
  min-width: 0;
  min-height: 0;
  border-radius: 14px;
  background: var(--back, #E8DEFF);
  box-shadow: var(--ply), var(--recess);
}

/* ---------- spinner bay ---------- */
.wheel-hole {
  --back: #D3ECFA;
  display: flex;
  flex-direction: column;
  gap: 1.6vmin;
  padding: calc(var(--ring) + 1.8vmin) calc(var(--ring) + 1.8vmin) calc(var(--ring) + 2.2vmin);
}
.spinner { flex: 1 1 0; min-height: 0; display: flex; justify-content: center; align-items: center; }
#wheel { display: block; width: 100%; height: 100%; overflow: visible; cursor: pointer; }
.lbl-ch { font-family: var(--font-ui); font-size: 25px; fill: var(--ink); }
#wheel-labels { transition: opacity 140ms var(--ease-out); }
#wheel-labels.fading { opacity: 0; }
.slice { transition: transform 260ms var(--ease-out); }
.slice.win { stroke: var(--ink); stroke-width: 5; }
#pointer { transform-box: view-box; transform-origin: 200px 20px; transition: transform 140ms var(--ease-out); }
#pointer.flick { transform: rotate(-16deg); transition: none; }

.slot { --hs: clamp(46px, 6.6vmin, 78px); position: relative; flex: 0 0 auto; height: clamp(160px, 31vh, 330px); display: grid; }
.spin-btn {
  align-self: center;
  justify-self: stretch;
  height: 2.5em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4em;
  padding: 0 .8em;
  border: 3.5px solid var(--ink);
  border-radius: 999px;
  background: linear-gradient(180deg, #CF3A69, var(--berry-deep));
  color: var(--paper);
  font-size: clamp(1.3rem, min(4.2vmin, 2.5vw), 2.9rem);
  box-shadow: inset 0 -.16em 0 rgba(52, 38, 74, .4), var(--depth-2);
  transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out);
}
.spin-btn svg { width: 1em; height: 1em; flex: none; }
.spin-btn:active { transform: translateY(3px); box-shadow: inset 0 -.06em 0 rgba(52, 38, 74, .4), var(--depth-1); }
.spin-btn[aria-disabled="true"] { cursor: default; }
.slot.seated .spin-btn { display: none; }


/* the customer's name tag, promoted face-out */
.guest {
  position: relative;
  align-self: stretch;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: center;
  align-items: center;
  column-gap: 1em;
  row-gap: .5em;
  padding: 1em 1.2em;
  background: linear-gradient(160deg, var(--paper) 58%, #F2EFF6);
  border: 3.5px solid var(--ink);
  border-radius: 22px;
  box-shadow: var(--depth-2);
  font-size: clamp(.9rem, min(2vmin, 1.25vw), 1.45rem);
  line-height: 1.12;
  opacity: 0;
  transition: opacity 200ms var(--ease-out);
}
.slot.seated .guest { display: grid; }
.slot:not(.seated) .guest { display: none; }
.guest.in { opacity: 1; }
.guest .disc { width: 4.8em; height: 4.8em; border-width: 3px; }
.g-who { min-width: 0; display: grid; gap: .25em; }
.g-name { font-size: 3.5em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-hello { font-size: 1.45em; }
.g-roles { grid-column: 1 / -1; font-size: 1.08em; color: var(--ink-soft); }
.swap {
  position: absolute;
  top: .6em;
  right: .6em;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  gap: .3em;
  padding: .3em .7em;
  border: 2px solid var(--ink-soft);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink-soft);
  font-size: .9em;
}
.swap svg { width: 1.1em; height: 1.1em; }
.swap.armed { background: var(--sun); color: var(--ink); border-color: var(--ink); }

/* ---------- the machine ---------- */
.machine-hole {
  --back: #E8DEFF;
  display: grid;
  place-items: center;
  padding: calc(var(--ring) + 2vmin);
}
.machine { position: relative; display: flex; flex-direction: column; width: 420px; height: 583px; --mw: 420px; }
.crown { position: relative; z-index: 2; display: block; width: 100%; height: auto; margin-bottom: -3px; overflow: visible; }
.crown-text { font-family: var(--font-sign); font-size: 31px; fill: var(--sun); }
.bulb { fill: #FFF1C2; stroke: var(--ink); stroke-width: 1.6; }
[data-phase="spin"] .bulb, [data-phase="play"] .bulb { animation: chase 480ms steps(1) infinite; }
[data-phase="spin"] .bulb:nth-child(2n), [data-phase="play"] .bulb:nth-child(2n) { animation-delay: 240ms; }
@keyframes chase { 50% { fill: var(--sun); } }
.cabinet {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--mw) * .035);
  padding: calc(var(--mw) * .04) calc(var(--mw) * .045) calc(var(--mw) * .045);
  background: linear-gradient(90deg, #F77E9F 0%, var(--berry) 14%, var(--berry) 82%, #D43C67 100%);
  border: 3.5px solid var(--ink);
  border-top-width: 0;
  border-radius: 0 0 calc(var(--mw) * .06) calc(var(--mw) * .06);
  box-shadow: var(--depth-2);
}
.feet { flex: 0 0 calc(var(--mw) * .03); display: flex; justify-content: space-between; padding: 0 12%; }
.feet i { width: 13%; height: 100%; background: var(--ink); border-radius: 0 0 6px 6px; }
.machine::after {
  content: "";
  position: absolute;
  z-index: -1;
  left: 4%;
  right: 4%;
  bottom: calc(var(--mw) * -.03);
  height: calc(var(--mw) * .07);
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(52, 38, 74, .3), rgba(52, 38, 74, 0));
}

.glass {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  border: calc(var(--mw) * .012) solid #FFF4F7;
  border-radius: calc(var(--mw) * .03);
  outline: 3px solid var(--ink);
  background: linear-gradient(180deg, #C9ECFF 0%, #93D2FA 70%, #7CC3F5 100%);
}
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  background: linear-gradient(115deg, transparent 16%, rgba(255, 255, 255, .5) 17%, rgba(255, 255, 255, .5) 21%, transparent 22%, transparent 27%, rgba(255, 255, 255, .3) 28%, rgba(255, 255, 255, .3) 29.5%, transparent 30.5%);
}
.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; }
.mound { position: absolute; z-index: 1; left: -10%; right: 16%; bottom: -18%; height: 44%; border-radius: 50%; background: radial-gradient(60% 55% at 45% 35%, #FFE3EC, #FFC6D8); }
.rail-bar { position: absolute; z-index: 30; left: 0; right: 0; top: 0; height: calc(var(--rail-h, 14px) + 3px); background: linear-gradient(180deg, #8C7FA6, #6A5E84 calc(100% - 3px), var(--ink) calc(100% - 3px)); }
.claw { position: absolute; z-index: 20; left: 0; top: 0; width: var(--claw-w, 60px); height: 100%; pointer-events: none; will-change: transform; }
.carriage { position: absolute; z-index: 31; top: 2px; left: 18%; width: 64%; height: calc(var(--rail-h, 14px) + 8px); background: var(--sun); border: 3px solid var(--ink); border-radius: 7px; }
.rope { position: absolute; top: var(--rail-h, 14px); left: calc(50% - var(--rope-w, 4px) / 2); width: var(--rope-w, 4px); height: var(--gh, 300px); background: var(--ink); transform-origin: 50% 0; will-change: transform; }
.head { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
.head svg { display: block; width: 100%; height: auto; overflow: visible; }
.prong { transition: transform 280ms var(--ease-out); transform-box: view-box; }
.prong.l { transform-origin: 44px 30px; }
.prong.r { transform-origin: 56px 30px; }
.claw.open .prong.l { transform: rotate(26deg); }
.claw.open .prong.r { transform: rotate(-26deg); }

.doll {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--dw, 80px);
  height: var(--dh, 88px);
  padding: 0;
  border: 0;
  background: none;
  transform-origin: 50% 50%;
  will-change: transform;
}
.doll-art { display: block; width: 100%; height: 100%; }
.doll-art svg { display: block; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.doll.held { z-index: 15 !important; pointer-events: none; }
[data-phase="ready"][data-grab="1"] .doll:not(.held) .doll-art { animation: wiggle 2.4s var(--ease-in-out) infinite; }
.doll:nth-child(3n) .doll-art { animation-delay: .4s !important; }
.doll:nth-child(3n + 1) .doll-art { animation-delay: .9s !important; }
@keyframes wiggle { 0%, 78%, 100% { transform: none; } 86% { transform: translateY(-5%) rotate(-5deg); } 93% { transform: rotate(4deg); } }

.chute {
  position: absolute;
  z-index: 18;
  right: 0;
  bottom: 0;
  width: 22%;
  height: 34%;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .34));
  border-top: 3px solid var(--ink);
  border-left: 3px solid var(--ink);
  border-radius: 12px 0 0 0;
}
.chute-tag {
  position: absolute;
  left: 50%;
  top: 16%;
  display: flex;
  align-items: center;
  gap: .15em;
  padding: .12em .45em .16em;
  background: var(--sun);
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  font-size: calc(var(--gw, 400px) * .046);
  white-space: nowrap;
  transform: translateX(-50%) rotate(-4deg);
}
.chute-tag svg { width: .9em; height: .9em; }

.hand { position: absolute; z-index: 25; display: none; height: auto; pointer-events: none; filter: drop-shadow(0 4px 4px rgba(52, 38, 74, .25)); animation: bob 900ms var(--ease-in-out) infinite alternate; }
@keyframes bob { from { transform: translate(0, 0) rotate(var(--rot, 0deg)); } to { transform: translate(var(--bx, 0px), var(--by, 10px)) rotate(var(--rot, 0deg)); } }
.spin-btn { position: relative; white-space: nowrap; }
.spin-btn .hand-spin { right: 7%; bottom: 72%; width: var(--hs); height: auto; --rot: 0deg; --by: 10px; z-index: 5; }
.hand-glass { left: 38%; top: 20%; width: calc(var(--gw, 400px) * .12); --by: 12px; }
[data-phase="idle"] .hand-spin { display: block; }
[data-phase="ready"][data-grab="1"] .hand-glass { display: block; }

.deck {
  flex: 0 0 calc(var(--mw) * .28);
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) calc(var(--mw) * .27);
  gap: calc(var(--mw) * .03);
  padding: calc(var(--mw) * .025);
  background: var(--deck);
  border: 3px solid var(--ink);
  border-radius: calc(var(--mw) * .035);
}
.led-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--mw) * .02); }
.led {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: .18em;
  padding: .25em .55em;
  background: var(--led-ground);
  border-radius: calc(var(--mw) * .02);
  box-shadow: inset 0 3px 8px rgba(0, 0, 0, .55);
  text-align: center;
  overflow: hidden;
}
.led-1 { color: var(--led); font-size: calc(var(--mw) * .058); line-height: 1.12; text-wrap: balance; }
.led-2 { color: var(--led-soft); font-size: max(1rem, calc(var(--mw) * .041)); line-height: 1.18; text-wrap: balance; }
.led.blink .led-1 { animation: led-in 260ms var(--ease-out); }
@keyframes led-in { from { opacity: .2; } }
.deck-actions { display: flex; align-items: center; justify-content: center; gap: calc(var(--mw) * .03); }
.deck-actions:empty { display: none; }
.coin-slot { width: calc(var(--mw) * .05); height: calc(var(--mw) * .11); flex: none; display: grid; place-items: center; background: #120B1B; border-radius: 7px; }
.coin-slot::before { content: ""; width: 22%; height: 66%; border-radius: 3px; background: #000; box-shadow: 0 0 0 2px var(--sun); }
.coin {
  width: calc(var(--mw) * .13);
  height: calc(var(--mw) * .13);
  min-width: 48px;
  min-height: 48px;
  flex: none;
  display: grid;
  place-content: center;
  padding: 0;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFF0B0, var(--sun) 55%, #E9A92A);
  box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .45), var(--depth-1);
  font-size: calc(var(--mw) * .04);
  line-height: 1;
}
.coin small { font-size: .62em; }
.coin.shake, .spin-btn.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.coin-fly { position: fixed; z-index: 90; pointer-events: none; }
.paid { color: var(--led); font-size: calc(var(--mw) * .042); }
.restock-btn {
  min-height: 44px;
  padding: .25em .9em;
  border: 3px solid var(--ink);
  border-radius: 999px;
  background: var(--sun);
  color: var(--ink);
  font-size: max(1rem, calc(var(--mw) * .042));
  box-shadow: inset 0 -.14em 0 rgba(52, 38, 74, .25);
}
.restock-btn:active { transform: translateY(2px); }
.door { min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: .25em; color: #F3E6D8; font-size: max(.95rem, calc(var(--mw) * .036)); text-align: center; line-height: 1.1; }
.door-mouth { position: relative; width: 100%; flex: 1; min-height: 0; display: grid; place-items: end center; overflow: hidden; background: #120B1B; border-radius: calc(var(--mw) * .02); box-shadow: inset 0 6px 10px rgba(0, 0, 0, .6); perspective: 260px; }
.door-prize { position: relative; width: 74%; height: 88%; }
.door-prize > svg { position: absolute; left: 50%; bottom: 0; height: 100%; width: auto; max-width: 100%; overflow: visible; transform: translateX(-50%); }
.flap { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 64%; background: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .14) calc(100% - 3px), rgba(255, 255, 255, .55) calc(100% - 3px)); transform-origin: 50% 0; transition: transform 300ms var(--ease-out); }
.door.open .flap { transform: rotateX(-68deg); }

/* ---------- the paper sign taped over the glass ---------- */
.banner {
  position: absolute;
  z-index: 60;
  left: -4%;
  right: -4%;
  top: 1%;
  bottom: 27%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(var(--mw) * .018);
  padding: calc(var(--mw) * .05) calc(var(--mw) * .05) calc(var(--mw) * .045);
  background: #FFFDF8;
  border: 3.5px solid var(--ink);
  border-radius: calc(var(--mw) * .04);
  box-shadow: var(--depth-2);
  text-align: center;
  animation: banner-in 320ms var(--ease-out);
}
@keyframes banner-in { from { opacity: 0; transform: translateY(14px) scale(.96); } }
.tape { position: absolute; top: calc(var(--mw) * -.028); width: calc(var(--mw) * .2); height: calc(var(--mw) * .056); background: rgba(255, 200, 61, .78); }
.tape.l { left: 8%; transform: rotate(-7deg); }
.tape.r { right: 8%; transform: rotate(6deg); }
.shout { display: flex; gap: .04em; font-family: var(--font-sign); font-size: min(6rem, calc(var(--mw) * .155)); line-height: 1; }
.shout span { color: var(--c); -webkit-text-stroke: .045em var(--ink); }
.banner[data-mode="miss"] .shout { animation: stamp 260ms var(--ease-out); }
@keyframes stamp { from { transform: scale(1.25) rotate(-6deg); opacity: 0; } }
.b-doll { width: calc(var(--mw) * .25); flex: 0 1 auto; min-height: 0; }
.b-doll svg { display: block; width: 100%; height: auto; overflow: visible; }
.banner[data-mode="ok"] .b-doll { animation: hop 1.1s var(--ease-in-out) infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8%) rotate(3deg); } }
.banner[data-mode="all"] { bottom: 3%; }
.b-roll { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--mw) * .012) calc(var(--mw) * .008); }
.b-roll figure { margin: 0; width: calc(var(--mw) * .1); display: grid; justify-items: center; gap: .1em; font-size: max(.8rem, calc(var(--mw) * .027)); }
.b-roll svg { width: 100%; height: auto; overflow: visible; }
.b-title { margin: 0; display: grid; gap: .1em; }
.b-name { font-size: calc(var(--mw) * .11); line-height: 1.05; }
.b-line { font-size: calc(var(--mw) * .058); line-height: 1.2; text-wrap: balance; }
.b-sub { margin: 0; max-width: 30em; color: var(--ink-soft); font-size: max(1rem, calc(var(--mw) * .045)); line-height: 1.3; text-wrap: balance; }
.big-btn {
  margin-top: calc(var(--mw) * .01);
  min-height: 48px;
  padding: .3em 1.1em .36em;
  border: 3.5px solid var(--ink);
  border-radius: 999px;
  background: linear-gradient(180deg, #CF3A69, var(--berry-deep));
  color: var(--paper);
  font-size: max(1.15rem, calc(var(--mw) * .06));
  box-shadow: inset 0 -.14em 0 rgba(52, 38, 74, .4), var(--depth-1);
  transition: transform 120ms var(--ease-out);
}
.big-btn:active { transform: translateY(3px); }

/* ---------- cubbies ---------- */
.cubby-col { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.cubby-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .4em 1em;
  padding: calc(var(--ring) + 1vmin) calc(var(--ring) + 1.6vmin);
  border-radius: 14px;
  background: linear-gradient(180deg, #FAE9CA, var(--birch));
  box-shadow: var(--ply);
  font-size: clamp(1rem, 2.6vmin, 1.9rem);
}
.cubby-head h2 { margin: 0; font-weight: 400; font-size: 1.15em; line-height: 1.1; }
.score { display: flex; align-items: center; gap: .3em; white-space: nowrap; }
.flips { display: flex; gap: .1em; perspective: 300px; }
.flip {
  position: relative;
  min-width: 1.05em;
  height: 1.42em;
  padding: 0 .12em;
  display: grid;
  place-items: center;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: .2em;
  font-size: 1.3em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  box-shadow: var(--depth-1);
}
.flip::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(52, 38, 74, .22); }
.cubbies { min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
.cubby { display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: calc(var(--ring) + .7vmin) calc(var(--ring) + .7vmin) calc(var(--ring) + .5vmin); }
.cubby.off { filter: saturate(.3); }
.prize { position: relative; min-height: 0; }
.prize > svg { position: absolute; left: 50%; bottom: .2vmin; height: calc(100% - .2vmin); width: auto; max-width: 100%; overflow: visible; transform: translateX(-50%); }
.count { position: absolute; right: 2%; top: 4%; padding: .05em .4em; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; font-size: clamp(.9rem, 2vmin, 1.4rem); }
.tag {
  position: relative;
  display: flex;
  align-items: center;
  gap: .32em;
  min-width: 0;
  padding: .26em .45em .26em .28em;
  background: linear-gradient(160deg, var(--paper) 55%, #F2EFF6);
  border: 2.5px solid var(--ink);
  border-radius: .5em;
  font-size: clamp(1rem, min(2.6vmin, 1.55vw), 1.8rem);
  line-height: 1.1;
  box-shadow: var(--depth-1);
}
.tag::before { content: ""; position: absolute; top: -.3em; left: 50%; width: .48em; height: .48em; margin-left: -.24em; border: 2px solid var(--ink); border-radius: 50%; background: var(--birch-lo); }
.tag.won::after { content: ""; position: absolute; top: -2.5px; right: -2.5px; width: 1.05em; height: 1.05em; border-top-right-radius: .5em; background: linear-gradient(225deg, var(--sun) 0 48%, var(--ink) 48% 54%, transparent 54%); }
.tag .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag .rest { flex: none; margin-left: auto; padding: .04em .35em; border: 2px solid var(--ink-soft); border-radius: 999px; color: var(--ink-soft); font-size: .7em; }
.disc { flex: none; width: 1.55em; height: 1.55em; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 50%; background: var(--c); }
.disc svg { width: 80%; height: 80%; overflow: visible; }
.cubby.away .tag { background: transparent; border-style: dashed; box-shadow: none; }
.cubby.away .tag > * { visibility: hidden; }

/* ---------- flights ---------- */
.flyer { position: fixed; z-index: 70; pointer-events: none; transform-origin: 50% 50%; will-change: transform; }
.flyer > .guest { width: 100%; height: 100%; opacity: 1; display: grid; }
.flyer > .tag { width: 100%; height: 100%; }
.flyer.doll-flyer > svg { position: absolute; left: 50%; bottom: 0; height: 100%; width: auto; max-width: 100%; overflow: visible; transform: translateX(-50%); }

/* ---------- teacher settings ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(52, 38, 74, .5); }
.sheet {
  width: min(100%, 860px);
  max-height: calc(100vh - 32px);
  overflow: auto;
  display: grid;
  gap: 14px;
  padding: 20px clamp(16px, 3vw, 28px) 24px;
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 22px;
  box-shadow: var(--depth-2);
  scrollbar-color: var(--birch-lo) transparent;
  font-size: 1.05rem;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { margin: 0; font-weight: 400; font-size: 1.7rem; }
.sheet h3 { margin: 8px 0 0; font-weight: 400; font-size: 1.25rem; }
.hint { margin: -6px 0 0; color: var(--ink-soft); line-height: 1.45; max-width: 60ch; }
.field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheet input[type="text"], .sheet select {
  min-height: 44px;
  padding: 6px 10px;
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
}
.roster { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.r-row { display: grid; grid-template-columns: 2em 2.6em 7.5em minmax(7em, 1fr) auto auto; align-items: center; gap: 10px; }
.r-no { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.r-sym .disc { width: 2.2em; height: 2.2em; }
.r-row select { width: 100%; }
.r-row input[type="text"] { width: 100%; min-width: 0; }
.r-abs { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.sheet input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--berry-deep); }
.r-seat, .ghost-btn { min-height: 44px; padding: 4px 12px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); white-space: nowrap; }
.r-seat:active, .ghost-btn:active { transform: translateY(2px); }
.opts { display: grid; gap: 10px; }
.opts label { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheet-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.sheet-actions .spacer { flex: 1; }
.warn { border-color: var(--berry-deep); color: var(--berry-deep); }
.warn.armed { background: var(--berry-deep); color: var(--paper); }

#confetti { position: fixed; inset: 0; z-index: 85; width: 100%; height: 100%; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- smaller landscape screens ---------- */
@media (max-width: 1199px) {
  .wheel-hole { padding: calc(var(--ring) + 1.4vmin); }
  .cubbies { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); }
}


/* ---------- portrait tablets and phones: the unit stacks ---------- */
@media (max-width: 899px), (max-aspect-ratio: 1/1) {
  html, body { height: auto; }
  .unit { height: auto; min-height: calc(100vh - 2 * var(--gutter)); grid-template-rows: auto auto; }
  .rail { grid-template-columns: auto minmax(0, 1fr) auto; }
  .sign { justify-self: center; font-size: clamp(1.4rem, 6.4vw, 3rem); }
  .plaque { font-size: clamp(.95rem, 3vw, 1.5rem); }
  .bays { grid-template-columns: minmax(0, 1fr); }
  .wheel-hole { flex-direction: row; align-items: center; gap: 3vw; padding: calc(var(--ring) + 3vw); }
  .spinner { flex: 1 1 50%; }
  #wheel { height: auto; }
  .slot { flex: 1 1 50%; height: auto; min-height: 200px; align-self: stretch; }
  .guest, .spin-btn { font-size: clamp(.95rem, 2.4vw, 1.4rem); }
  .spin-btn { font-size: clamp(1.25rem, 3.6vw, 2.2rem); }
  .machine-hole { padding: calc(var(--ring) + 3vw); }
  .cubby-col { grid-template-rows: auto auto; }
  .cubbies { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(150px, auto); }
  .tag { font-size: clamp(.95rem, 2.4vw, 1.4rem); }
  .cubby-head { font-size: clamp(1rem, 3vw, 1.6rem); }
}
@media (max-width: 600px) {
  .rail { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "plaque knobs" "sign sign"; row-gap: 12px; }
  .sign { font-size: clamp(1.3rem, 8.2vw, 2.4rem); }
  .wheel-hole { flex-direction: column; align-items: stretch; }
  .spinner { flex: none; }

  .guest { font-size: clamp(.85rem, 3.4vw, 1.1rem); }

  .cubbies { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(140px, auto); }
  .tag { font-size: clamp(.9rem, 4vw, 1.1rem); }
  .r-row { display: flex; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 2px dashed rgba(52, 38, 74, .2); }
  .r-row input[type="text"] { flex: 1 1 9em; width: auto; }
  .r-row select { flex: 1 1 7em; width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .hand, .doll-art, .b-doll, .bulb, .shout, .banner { animation: none !important; }

  /* ---------- dolls in the glass ---------- */

      { y: 0.865, n: 5, z: 4, a: 0.12, b: 0.68 },
    ];

    const list = []; let k = 0;
    const stamp = Date.now().toString(36);
    rows.forEach((row) => {
      for (let i = 0; i < row.n; i++) {
        const t = row.n === 1 ? 0.5 : i / (row.n - 1);
        const x = row.a + (row.b - row.a) * t + (Math.random() - 0.5) * 0.025;
        list.push({ id: `d${stamp}-${k}`, kind: kinds[k++ % kinds.length], x: +x.toFixed(3), y: +(row.y + (Math.random() - 0.5) * 0.02).toFixed(3), z: row.z, r: Math.round((Math.random() - 0.5) * 24) });

  }
  function drawDolls() {

  async function restock(animated) {

  /* ---------- the name wheel ---------- */
  const WC = { cx: 200, cy: 222, r: 178 };
  const wpt = (deg, r) => { const a = (deg * Math.PI) / 180; return [WC.cx + r * Math.sin(a), WC.cy - r * Math.cos(a)]; };
  function eligible() {

  }
  function drawWheel() {

    const n = ids.length, seg = 360 / Math.max(1, n);

      const col = BINS[id % BINS.length].c;

      } else {

  function orientLabels(A) {
    const n = run.wheelIds.length, seg = 360 / Math.max(1, n);

      const i = +g.dataset.i;
      const a = n === 1 ? 0 : i * seg;

    const slip = !(st.sure && run.tries > 0) && Math.random() < (MISS_P[st.miss] || 0);
    run.tries++;
    setLED(`${josa(dn, '이', '가')} 매달렸어요!`, '조심조심…');
    sfx.motor(1000);
    if (slip) {
      await tween(650, (p) => { run.rope = lerp(target, (target + REST) / 2, p); });
      const cx = run.clawX * G.W, yNow = run.rope * G.H + G.heldDY;
      run.held = null; run.open = true; render();
      el.classList.remove('held');
      await tween(460, (p) => { el.style.transform = dollTransform(lerp(cx, d.x * G.W, p), lerp(yNow, d.y * G.H, p), d.r * p); }, easeIn);
      placeDoll(d);
      sfx.miss();
      setLED('앗, 놓쳤어요!', '괜찮아요, 다시 할 수 있어요');
      const r0 = run.rope;
      await tween(450, (p) => { run.rope = lerp(r0, REST, p); });
      run.open = false;
      const x1 = run.clawX;
      await tween(700, (p) => { run.clawX = lerp(x1, HOME_X, p); });
      run.phase = 'result';
      refresh();
      showBanner('miss', who, d.kind);
      return;
    }
    await tween(1000, (p) => { run.rope = lerp(target, REST, p); });
    const x1 = run.clawX, carry = 600 + Math.abs(HOME_X - x1) * 1100;
    sfx.motor(carry);
    await tween(carry, (p) => { run.clawX = lerp(x1, HOME_X, p); });
    await wait(250);
    const cx = run.clawX * G.W, y0 = run.rope * G.H + G.heldDY;
    run.held = null; run.open = true; render();
    sfx.drop();
    await tween(550, (p) => { el.style.transform = dollTransform(cx, lerp(y0, G.H * 1.3, p), 0); }, easeIn);
    run.open = false; render();
    st.dolls = st.dolls.filter((x) => x.id !== d.id);
    el.remove();
    st.prizes[who].push(d.kind);
    run.stow = { id: who, kind: d.kind };
    save();
    run.phase = 'result';
    refresh();
    const door = $('door'), prize = $('door-prize');
    prize.innerHTML = dollSVG(d.kind);
    prize.style.visibility = '';
    door.classList.add('open');
    animate(prize, [{ transform: 'translateY(45%) scale(.92)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 360, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    sfx.pop();
    setLED('성공! 선물이 나왔어요', '선물 나오는 곳을 보세요!');
    await wait(1000);
    showBanner('ok', who, d.kind);
  }

  /* ---------- the taped paper sign ---------- */
  function showBanner(mode, who, kind) {
    run.bannerMode = mode;
    const b = $('banner');
    b.dataset.mode = mode;
    const shout = mode === 'ok' ? '성공~~~!' : mode === 'miss' ? '꽝~~!' : '모두 성공!';
    const colors = SHOUT_COLORS[mode];
    $('shout').innerHTML = Array.from(shout).map((ch, i) => (ch === ' ' ? '<span>&nbsp;</span>' : `<span style="--c:${colors[i % colors.length]}">${esc(ch)}</span>`)).join('');
    const title = $('b-title'), sub = $('b-sub'), btn = $('b-btn'), dollBox = $('b-doll');
    if (mode === 'ok') {
      dollBox.className = 'b-doll';
      dollBox.innerHTML = dollSVG(kind);
      title.innerHTML = `<span class="b-name">${esc(name(who))}</span><span class="b-line">${esc(josa(KINDS[kind], '을', '를'))} 뽑았어요!</span>`;
      sub.textContent = '친구들이 응원해서 성공했네요!';
      btn.textContent = '내 사물함에 넣기!';
      sfx.win();
      announce(`성공! ${name(who)} 손님이 ${josa(KINDS[kind], '을', '를')} 뽑았어요. 친구들이 응원해서 성공했네요!`);
    } else if (mode === 'miss') {
      dollBox.className = 'b-doll';
      dollBox.innerHTML = dollSVG(kind);
      title.innerHTML = `<span class="b-line">이번에는 아쉽게도 ${esc(josa(KINDS[kind], '을', '를'))} 잡지 못했네요!</span>`;
      sub.textContent = st.sure ? '다른 방법을 생각해 볼까요? 다시 하면 꼭 뽑을 수 있어요!' : '다른 방법을 생각해 볼까요? 한 번 더 도전해요!';
      btn.textContent = '다시 도전!';
      announce('꽝! 이번에는 아쉽게도 잡지 못했네요. 다시 도전해요.');
    } else {
      dollBox.className = 'b-roll';
      dollBox.innerHTML = present().map((i) => { const p = st.prizes[i]; return `<figure>${dollSVG(p[p.length - 1])}<figcaption>${esc(name(i))}</figcaption></figure>`; }).join('');
      title.innerHTML = `<span class="b-name">${esc(st.className)} 친구들</span><span class="b-line">모두 인형을 뽑았어요!</span>`;
      sub.textContent = '다 같이 힘을 모아 모두 성공했네요! 짝짝짝!';
      btn.textContent = '사물함 구경하기';
      sfx.fanfare();
      announce(`${st.className} 친구들 모두 성공했어요!`);
    }
    b.hidden = false;
    btn.focus({ preventScroll: true });
    if (mode !== 'miss') confetti(b);
  }
  $('b-btn').addEventListener('click', async () => {
    const mode = run.bannerMode;
    if (!mode) return;
    run.bannerMode = null;
    $('banner').hidden = true;
    if (mode === 'ok') { await stow(); return; }
    if (mode === 'miss') { run.phase = 'ready'; refresh(); return; }
    run.phase = 'idle';
    drawWheel();
    refresh();
    spinBtn.focus({ preventScroll: true });
  });

  async function stow() {
    run.phase = 'stow';
    refresh();
    const { id, kind } = run.stow;
    const cub = cubbyEl(id);
    const prizeBox = $('door-prize');
    const from = prizeBox.getBoundingClientRect();
    const to = cub.querySelector('.prize').getBoundingClientRect();
    prizeBox.style.visibility = 'hidden';
    setLED(`${name(id)} 사물함에 쏙!`, '');
    sfx.whoosh();
    const doll = fly({ from, to, html: dollSVG(kind), duration: 950, arc: Math.max(60, G.H * 0.25), cls: 'doll-flyer' });
    await wait(160);
    const tag = sendGuestHome(id);
    const [f1, f2] = await Promise.all([doll, tag]);
    run.stow = null;
    st.turn = null; run.paid = false; run.tries = 0;
    save();
    slot.classList.remove('seated');
    const fresh = renderCubby(id);
    f1.remove(); f2.remove();
    $('door').classList.remove('open');
    prizeBox.innerHTML = '';
    prizeBox.style.visibility = '';
    if (fresh) animate(fresh.querySelector('.prize'), [{ transform: 'scale(.9)' }, { transform: 'scale(1.06)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: 360, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    sfx.pop();
    renderScore(true);
    if (!st.dolls.length) await restock(true);
    if (allDone()) { drawWheel(); await finale(); return; }
    run.phase = 'idle';
    drawWheel();
    refresh();
    spinBtn.focus({ preventScroll: true });
  }
  async function finale() {
    run.phase = 'finale';
    refresh();
    setLED(`${st.className} 모두 성공!`, '짝짝짝!');
    const order = present();
    order.forEach((i, k) => {
      const box = cubbyEl(i) && cubbyEl(i).querySelector('.prize');
      if (box) animate(box, [{ transform: 'scale(1)' }, { transform: 'translateY(-8%) scale(1.08)', offset: 0.5 }, { transform: 'scale(1)' }], { duration: 420, delay: k * 70, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    });
    await wait(order.length * 70 + 300);
    showBanner('all');
  }

  /* ---------- teacher: swap the customer ---------- */
  $('swap').addEventListener('click', async () => {
    if (run.phase !== 'ready') return;
    const lbl = $('swap-label'), btn = $('swap');
    if (!run.swapArmed) {
      run.swapArmed = true;
      btn.classList.add('armed');
      lbl.textContent = '한 번 더 누르면 바뀌어요';
      clearTimeout(run.swapTimer);
      run.swapTimer = setTimeout(disarmSwap, 3000);
      return;
    }
    disarmSwap();
    await unseat();
  });
  function disarmSwap() {
    run.swapArmed = false;
    $('swap').classList.remove('armed');
    $('swap-label').textContent = '다른 친구로';
  }
  async function unseat() {
    if (st.turn === null) return;
    const id = st.turn;
    run.phase = 'reveal';
    refresh();
    const f = await sendGuestHome(id);
    st.turn = null; run.paid = false; run.tries = 0;
    save();
    slot.classList.remove('seated');
    renderCubby(id);
    f.remove();
    run.phase = 'idle';
    markWinner(-1);
    refresh();
  }
  async function teacherSeat(i) {
    if (run.phase !== 'idle' && run.phase !== 'ready') return;
    if (st.turn === i && run.phase === 'ready') return;
    if (run.phase === 'ready') await unseat();
    markWinner(i);
    await seatGuest(i);
  }

  /* ---------- confetti ---------- */
  const cv = $('confetti'), cx = cv.getContext('2d');
  function confetti(originEl) {
    if (reduce) return;
    const r = originEl.getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height * 0.3;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const colors = ['#FFC83D', '#74C4F2', '#FF94B8', '#86CF6E', '#BBA3F5', '#FF8A5C', '#FFFFFF'];
    const parts = Array.from({ length: 150 }, () => ({
      x: ox + (Math.random() - 0.5) * 140, y: oy,
      vx: (Math.random() - 0.5) * 17, vy: -Math.random() * 15 - 6, s: 7 + Math.random() * 8,
      c: colors[(Math.random() * colors.length) | 0], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4,
    }));
    const t0 = performance.now();
    const frame = (now) => {
      const t = now - t0;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach((q) => {
        q.vy += 0.45; q.vx *= 0.99; q.x += q.vx; q.y += q.vy; q.a += q.va;
        cx.save(); cx.translate(q.x, q.y); cx.rotate(q.a); cx.fillStyle = q.c;
        cx.globalAlpha = Math.max(0, 1 - t / 2600);
        cx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2);
        cx.restore();
      });
      if (t < 2600) requestAnimationFrame(frame); else cx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(frame);
  }

  /* ---------- settings ---------- */
  const resetBtn = $('btn-reset');
  function buildRoster() {
    const opts = SYM_KEYS.map((k) => `<option value="${k}">${SYMBOLS[k]}</option>`).join('');
    $('roster').innerHTML = st.names.map((_, i) => `
      <div class="r-row">
        <span class="r-no">${i + 1}</span>
        <span class="r-sym" id="symprev-${i + 1}"></span>
        <select id="sym-${i + 1}" aria-label="${i + 1}번 그림 표시">${opts}</select>
        <input type="text" id="name-${i + 1}" maxlength="10" autocomplete="off" aria-label="${i + 1}번 이름">
        <label class="r-abs"><input type="checkbox" id="abs-${i + 1}"> 결석</label>
        <button class="r-seat" type="button" data-i="${i}">지금 차례</button>
      </div>`).join('');
    st.names.forEach((nm, i) => {
      $(`name-${i + 1}`).value = nm;
      const sel = $(`sym-${i + 1}`);
      sel.value = st.symbols[i];
      const prev = () => { $(`symprev-${i + 1}`).innerHTML = `<span class="disc" style="--c:${BINS[i % BINS.length].c}">${symbolSVG(sel.value)}</span>`; };
      sel.addEventListener('change', prev);
      prev();
      $(`abs-${i + 1}`).checked = st.absent[i];
    });
    $('roster').querySelectorAll('.r-seat').forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      applySettings();
      $(`abs-${i + 1}`).checked = false;
      st.absent[i] = false;
      closeSettings();
      afterSettings();
      teacherSeat(i);
    }));
  }
  function openSettings() {
    if (!['idle', 'ready'].includes(run.phase)) return;
    $('class-input').value = st.className;
    buildRoster();
    $('opt-miss').value = st.miss;
    $('opt-sure').checked = st.sure;
    $('opt-skip').checked = st.skipDone;
    $('opt-coin').checked = st.coinOn;
    $('opt-sound').checked = st.soundOn;
    resetBtn.classList.remove('armed');
    resetBtn.textContent = '처음부터 다시 하기';
    $('settings').hidden = false;
    $('class-input').focus();
  }
  function closeSettings() { $('settings').hidden = true; $('btn-settings').focus({ preventScroll: true }); }
  function applySettings() {
    st.className = $('class-input').value.trim().slice(0, 12) || '우리 반';
    st.names = st.names.map((old, i) => $(`name-${i + 1}`).value.trim().slice(0, 10) || old);
    st.symbols = st.symbols.map((old, i) => $(`sym-${i + 1}`).value || old);
    st.absent = st.absent.map((_, i) => $(`abs-${i + 1}`).checked);
    st.miss = $('opt-miss').value;
    st.sure = $('opt-sure').checked;
    st.skipDone = $('opt-skip').checked;
    st.coinOn = $('opt-coin').checked;
    st.soundOn = $('opt-sound').checked;
    if (st.turn !== null && st.absent[st.turn]) {
      st.turn = null;
      slot.classList.remove('seated');
      guest.classList.remove('in');
      if (run.phase === 'ready') run.phase = 'idle';
    }
    save();
  }
  function afterSettings() {
    if (st.turn !== null) fillGuest(st.turn);
    drawWheel();
    renderCubbies();
    refresh();
  }
  $('btn-settings').addEventListener('click', openSettings);
  $('settings-close').addEventListener('click', closeSettings);
  $('settings-form').addEventListener('submit', (e) => { e.preventDefault(); applySettings(); closeSettings(); afterSettings(); });
  $('btn-restock').addEventListener('click', () => { applySettings(); closeSettings(); afterSettings(); restock(true); });
  resetBtn.addEventListener('click', () => {
    if (!resetBtn.classList.contains('armed')) {
      resetBtn.classList.add('armed');
      resetBtn.textContent = '정말 지울까요? 한 번 더 누르세요';
      return;
    }
    applySettings();
    st.prizes = defaults().prizes;
    st.turn = null; run.paid = false; run.tries = 0; run.stow = null;
    run.phase = 'idle';
    slot.classList.remove('seated');
    guest.classList.remove('in');
    markWinner(-1);
    closeSettings();
    shownScore = null;
    afterSettings();
    restock(true);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('settings').hidden) closeSettings(); });

  /* ---------- extras ---------- */
  $('btn-full').addEventListener('click', () => {
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) { /* not allowed here */ }
  });
  let lockTried = false;
  document.addEventListener('pointerdown', () => {
    if (lockTried) return;
    lockTried = true;
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* ignore */ }
  });
  spinBtn.addEventListener('click', spin);
  $('wheel').addEventListener('click', spin);

  /* ---------- start ---------- */
  $('bulbs').innerHTML = (() => {
    let s = '';
    for (let x = 40; x <= 360; x += 20) s += `<circle class="bulb" cx="${x}" cy="13.5" r="4.4"/>`;
    [30, 48].forEach((y) => { s += `<circle class="bulb" cx="18" cy="${y}" r="4.4"/><circle class="bulb" cx="382" cy="${y}" r="4.4"/>`; });
    return s;
  })();
  if (!st.dolls) st.dolls = freshDolls();
  renderCubbies();
  drawWheel();
  if (st.turn !== null) {
    fillGuest(st.turn);
    slot.classList.add('seated');
    guest.classList.add('in');
    run.phase = 'ready';
    markWinner(st.turn);
    renderCubbies();
  }
  layout();
  drawDolls();
  refresh();
  if (window.ResizeObserver) new ResizeObserver(queueLayout).observe(document.querySelector('.bays'));
  window.addEventListener('resize', queueLayout);
  if (STACK.addEventListener) STACK.addEventListener('change', queueLayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueLayout);
})();
</script>
</body>
</html>
